name: Dependency Review

on:
  pull_request:

permissions:
  # contents: write is required by the dependency-graph snapshot submission API
  contents: write
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependencies
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fast-iq'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # GitHub's JS detector does not parse pnpm v10 lockfiles, so the
      # dependency graph would be empty and this review useless without
      # explicit snapshots. Submit head + base snapshots first.
      - name: Submit dependency snapshots
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python3 .github/scripts/dep_snapshot.py "$GITHUB_API_URL" "$GITHUB_REPOSITORY" src/package.json src/pnpm-lock.yaml
          GITHUB_HEAD_SHA="${{ github.event.pull_request.base.sha }}" \
          GITHUB_REF="refs/heads/${{ github.event.pull_request.base.ref }}" \
          python3 .github/scripts/dep_snapshot.py "$GITHUB_API_URL" "$GITHUB_REPOSITORY" src/package.json src/pnpm-lock.yaml

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          base: main
