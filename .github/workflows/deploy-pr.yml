name: Pull Request

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build Docker
    runs-on: ${{ matrix.arch.os }}
    if: github.repository_owner == 'fast-iq'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare
        run: |
          platform=${{ matrix.arch.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.arch.platform }}
          tags: ghcr.io/fast-iq/awg-easy:pr
          cache-from: type=gha
          cache-to: type=gha,mode=min,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Smoke test
        if: matrix.arch.platform == 'linux/amd64'
        run: |
          # INSECURE=true: session cookie without the Secure flag so curl
          # over plain http in CI can send it back (matches install.sh).
          # PORT=3000: app defaults to 51821; keep the curl targets simple.
          # NET_ADMIN/SYS_MODULE + /dev/net/tun: let wg-quick actually create
          # wg0 (GitHub runner kernels have WireGuard built in); without these
          # amneziawg-go userspace fallback hangs on TUN for ~60s before the
          # server finishes booting (p.51).
          docker run -d --name awg-smoke -p 3000:3000 \
            -e INSECURE=true -e PORT=3000 \
            --cap-add NET_ADMIN --cap-add SYS_MODULE \
            --device /dev/net/tun \
            ghcr.io/fast-iq/awg-easy:pr

          # 1) server responds (static health)
          ok=0
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/information > /dev/null; then
              echo "Server responds on /api/information"
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            docker logs awg-smoke
            echo "Smoke test failed: server did not respond within 90s"
            exit 1
          fi

          # 1b) security headers from nuxt.config routeRules must be present
          headers=$(curl -s -D - -o /dev/null http://localhost:3000/api/information)
          echo "$headers" | grep -qi '^content-security-policy:' \
            || { docker logs awg-smoke; echo "Smoke test failed: CSP header missing"; exit 1; }
          echo "$headers" | grep -qi '^x-content-type-options: nosniff' \
            || { docker logs awg-smoke; echo "Smoke test failed: nosniff header missing"; exit 1; }
          # x-powered-by is stripped by the nitro render plugin (SSR pages)
          page_headers=$(curl -s -D - -o /dev/null http://localhost:3000/login)
          echo "$page_headers" | grep -qi '^x-powered-by' \
            && { docker logs awg-smoke; echo "Smoke test failed: x-powered-by still set on SSR page"; exit 1; }

          # 2) authenticated path: setup admin -> login -> DB-backed endpoints
          #    (catches broken migrations/Database proxy/repo regressions that
          #     used to pass the old static smoke test — see AGENTS p.45-47)
          curl -sf -X POST http://localhost:3000/api/setup/2 \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoketest","password":"smoke-test-password-1","confirmPassword":"smoke-test-password-1"}' \
            || { docker logs awg-smoke; echo "Smoke test failed: POST /api/setup/2"; exit 1; }

          curl -sf -c /tmp/smoke-cookies.txt -X POST http://localhost:3000/api/session \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoketest","password":"smoke-test-password-1","remember":false}' \
            || { docker logs awg-smoke; echo "Smoke test failed: POST /api/session login"; exit 1; }

          curl -sf -b /tmp/smoke-cookies.txt http://localhost:3000/api/admin/users > /dev/null \
            || { docker logs awg-smoke; echo "Smoke test failed: GET /api/admin/users with session"; exit 1; }

          # 3) admin CRUD + DB-backed surfaces (users, general config, backup, SSE)
          #    NOTE: every authenticated call must pass the login cookie jar (-b);
          #    omitting it produced a confusing 401 failure in the first runs.
          code=$(curl -s -b /tmp/smoke-cookies.txt -o /tmp/smoke-resp.txt -w '%{http_code}' \
            -X POST http://localhost:3000/api/admin/users \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-viewer","password":"ci-viewer-password-1","role":2}')
          if [ "$code" != "200" ]; then
            docker logs awg-smoke
            echo "Smoke test failed: POST /api/admin/users create -> HTTP $code: $(cat /tmp/smoke-resp.txt)"
            exit 1
          fi
          users_count=$(curl -sf -b /tmp/smoke-cookies.txt http://localhost:3000/api/admin/users \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          if [ "$users_count" != "2" ]; then
            docker logs awg-smoke
            echo "Smoke test failed: expected 2 users, got $users_count"
            exit 1
          fi

          # general config round-trip (schema + zod + sqlite)
          code=$(curl -s -b /tmp/smoke-cookies.txt -o /tmp/smoke-resp.txt -w '%{http_code}' \
            -X POST http://localhost:3000/api/admin/general \
            -H 'Content-Type: application/json' \
            -d '{"sessionTimeout":3600,"metricsPrometheus":false,"metricsJson":false,"metricsPassword":null,"autoDeleteExpiredClients":true}')
          if [ "$code" != "200" ]; then
            docker logs awg-smoke
            echo "Smoke test failed: POST /api/admin/general -> HTTP $code: $(cat /tmp/smoke-resp.txt)"
            exit 1
          fi
          curl -sf -b /tmp/smoke-cookies.txt http://localhost:3000/api/admin/general \
            | grep -q '"autoDeleteExpiredClients":true' \
            || { docker logs awg-smoke; echo "Smoke test failed: autoDeleteExpiredClients not persisted"; exit 1; }

          # DB backup must download as a real SQLite file (VACUUM INTO path)
          curl -sf -b /tmp/smoke-cookies.txt http://localhost:3000/api/admin/backup -o /tmp/smoke-backup.db \
            || { docker logs awg-smoke; echo "Smoke test failed: GET /api/admin/backup"; exit 1; }
          head -c 15 /tmp/smoke-backup.db | grep -q 'SQLite format 3' \
            || { docker logs awg-smoke; echo "Smoke test failed: backup is not a SQLite file"; exit 1; }

          # SSE endpoint must respond as an event stream (auth-gated separately below)
          sse_headers=$(curl -s -m 3 -D - -o /dev/null -b /tmp/smoke-cookies.txt http://localhost:3000/api/sse || true)
          echo "$sse_headers" | grep -qi 'content-type: text/event-stream' \
            || { docker logs awg-smoke; echo "Smoke test failed: /api/sse not an event stream"; exit 1; }

          # 4) unauthenticated API must be gated
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/client)
          if [ "$code" != "401" ]; then
            docker logs awg-smoke
            echo "Smoke test failed: GET /api/client unauthenticated returned $code, expected 401"
            exit 1
          fi

          # 5) logout must expire the session cookie in the response
          #    (h3 sessions are sealed cookies — the jar itself must lose it)
          curl -sf -b /tmp/smoke-cookies.txt -c /tmp/smoke-cookies.txt \
            -X DELETE http://localhost:3000/api/session > /dev/null \
            || { docker logs awg-smoke; echo "Smoke test failed: DELETE /api/session"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/smoke-cookies.txt http://localhost:3000/api/admin/users)
          if [ "$code" != "401" ]; then
            docker logs awg-smoke
            echo "Smoke test failed: after logout GET /api/admin/users returned $code, expected 401"
            exit 1
          fi

          echo "Smoke test passed (health + setup + login + CRUD + config + backup + SSE + auth gate + logout)"

      - name: OWASP ZAP baseline scan
        if: matrix.arch.platform == 'linux/amd64' && always()
        run: |
          # reuse the smoke container if it is up, otherwise start a fresh one
          if ! curl -sf http://localhost:3000/api/information > /dev/null; then
            docker start awg-smoke 2>/dev/null || \
              docker run -d --name awg-smoke -p 3000:3000 \
                -e INSECURE=true -e PORT=3000 \
                --cap-add NET_ADMIN --cap-add SYS_MODULE \
                --device /dev/net/tun ghcr.io/fast-iq/awg-easy:pr
            for i in $(seq 1 45); do
              curl -sf http://localhost:3000/api/information > /dev/null && break
              sleep 2
            done
          fi
          mkdir -p zap-out
          # the zap image runs as uid 1000 while the runner user is 1001 —
          # without this the report write fails (AccessDenied /zap/wrk/...)
          chmod 777 zap-out
          # host networking so ZAP reaches localhost:3000; -I: warnings do
          # not fail the scan — only High/Critical findings exit 1 (the
          # first triaged baseline had FAIL=0; gate now blocks on High+)
          docker run --rm --network host \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            docker.io/zaproxy/zap-stable:latest \
            zap-baseline.py -t http://localhost:3000 -m zap-report.md -I
          ls -la zap-out/

      - name: Upload ZAP report
        if: matrix.arch.platform == 'linux/amd64' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: zap-out/zap-report.md
          if-no-files-found: warn
          retention-days: 14
