name: Pull Request

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build Docker
    runs-on: ${{ matrix.arch.os }}
    if: github.repository_owner == 'fast-iq'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Prepare
        run: |
          platform=${{ matrix.arch.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.arch.platform }}
          tags: ghcr.io/fast-iq/awg-easy:pr
          cache-from: type=gha
          cache-to: type=gha,mode=min,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Smoke test
        if: matrix.arch.platform == 'linux/amd64'
        run: |
          docker run -d --name awg-smoke -p 3000:3000 ghcr.io/fast-iq/awg-easy:pr
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/information > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs awg-smoke
          echo "Smoke test failed: server did not respond within 60s"
          exit 1
