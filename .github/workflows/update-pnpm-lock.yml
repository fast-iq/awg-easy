name: Update Lockfile

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  update-lockfile:
    name: Update pnpm-lock.yaml
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fast-iq'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Update lockfile
        run: |
          cd src
          pnpm install --lockfile-only

      - name: Commit and push changes
        # push events only: PR runs check out a detached merge ref
        # that cannot be pushed back; pnpm install above already validated the lock
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "chore: update pnpm-lock.yaml"
          git push
