name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Check Docs
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Check docs formatting
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format:check:docs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: docs
    if: github.repository_owner == 'fast-iq'

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        command: ["lint", "typecheck", "format:check", "test"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: pnpm ${{ matrix.command }}
        run: |
          cd src
          pnpm install --no-frozen-lockfile
          pnpm ${{ matrix.command }}

  knip:
    name: Knip (unused code/deps)
    runs-on: ubuntu-latest
    needs: docs
    # non-blocking: knip на nuxt-autoimport даёт ложные срабатывания на новых файлах —
    # job лишь подсвечивает проблемы (см. src/knip.json с baseline ignoreIssues)
    continue-on-error: true
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: pnpm knip
        run: |
          cd src
          pnpm install --no-frozen-lockfile
          pnpm knip

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: docs
    if: github.repository_owner == 'fast-iq'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Audit dependencies (critical only)
        run: |
          cd src
          pnpm install --no-frozen-lockfile
          pnpm audit --audit-level=critical

      - name: Audit root dependencies (critical only)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm audit --audit-level=critical

  # keep GitHub's Dependency Graph current for Dependabot alerts and
  # Dependency Review (GitHub's JS detector does not parse pnpm v10
  # lockfiles, so without this the graph stays empty). Isolated job: the
  # snapshot submission API is the ONLY thing here that needs contents:write
  # (AGENTS p.114) — everything else runs contents:read.
  dependency-snapshot:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fast-iq' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Submit dependency graph snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/dep_snapshot.py "${GITHUB_API_URL:-https://api.github.com}" "$GITHUB_REPOSITORY" src/package.json src/pnpm-lock.yaml
