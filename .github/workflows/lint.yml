name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Check Docs
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Check docs formatting
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format:check:docs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: docs
    if: github.repository_owner == 'fast-iq'

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        command: ["lint", "typecheck", "format:check", "test"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: pnpm ${{ matrix.command }}
        run: |
          cd src
          pnpm install --no-frozen-lockfile
          pnpm ${{ matrix.command }}

  knip:
    name: Knip (unused code/deps)
    runs-on: ubuntu-latest
    needs: docs
    # non-blocking: knip на nuxt-autoimport даёт ложные срабатывания на новых файлах —
    # job лишь подсвечивает проблемы (см. src/knip.json с baseline ignoreIssues)
    continue-on-error: true
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: pnpm knip
        run: |
          cd src
          pnpm install --no-frozen-lockfile
          pnpm knip

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: docs
    if: github.repository_owner == 'fast-iq'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4.4.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: "pnpm"

      - name: Audit dependencies (critical only)
        run: |
          cd src
          pnpm install --no-frozen-lockfile
          pnpm audit --audit-level=critical

      - name: Audit root dependencies (critical only)
        run: |
          pnpm install --no-frozen-lockfile
          pnpm audit --audit-level=critical

      # keep GitHub's Dependency Graph current for Dependabot alerts and
      # Dependency Review (GitHub's JS detector does not parse pnpm v10
      # lockfiles, so without this the graph stays empty)
      - name: Submit dependency graph snapshot
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/dep_snapshot.py "${GITHUB_API_URL:-https://api.github.com}" "$GITHUB_REPOSITORY" src/package.json src/pnpm-lock.yaml
