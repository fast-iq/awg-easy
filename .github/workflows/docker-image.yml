name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3025 is a false positive in the action's hadolint v2.12.0 image:
          # it cannot parse "HEALTHCHECK --interval=... CMD /bin/sh -c ..." and
          # flags the JSON-looking CMD. Fixed upstream (v2.15.0, commit 6e37923).
          # DL3003/DL3016/DL3018/DL4006 are intentional: cd in RUN is clearer
          # than extra WORKDIRs, libsql is installed unpinned on purpose
          # (native binary, see Dockerfile comment), apk versions are tracked
          # via the base image, pipefail is not needed for these pipes.
          # DL3059/DL3019: consecutive RUN and --no-cache suggestions — most
          # already fixed in Dockerfile; remaining cases are intentional
          # (separate cache layers for kernel module build steps).
          ignore: DL3025,DL3003,DL3016,DL3018,DL4006,DL3059,DL3019

  build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  trivy:
    name: Scan image for CVEs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: awg-easy:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          ignorefile: .trivyrig

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: awg-easy:ci
          output: sbom.cdx.json
          format: cyclonedx
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
