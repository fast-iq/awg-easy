name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3025 is a false positive in the action's hadolint v2.12.0 image:
          # it cannot parse "HEALTHCHECK --interval=... CMD /bin/sh -c ..." and
          # flags the JSON-looking CMD. Fixed upstream (v2.15.0, commit 6e37923).
          # DL3003/DL3016/DL3018/DL4006 are intentional: cd in RUN is clearer
          # than extra WORKDIRs, libsql is installed unpinned on purpose
          # (native binary, see Dockerfile comment), apk versions are tracked
          # via the base image, pipefail is not needed for these pipes.
          # DL3059/DL3019: consecutive RUN and --no-cache suggestions — most
          # already fixed in Dockerfile; remaining cases are intentional
          # (separate cache layers for kernel module build steps).
          ignore: DL3025,DL3003,DL3016,DL3018,DL4006,DL3059,DL3019

  build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  trivy:
    name: Scan image for CVEs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
      - name: Install Trivy
        run: |
          # Direct release download instead of trivy-action: its setup-trivy
          # installer resolves the binary version via anonymous api.github.com
          # calls, which get rate-limited from shared runner IPs and fail as
          # bogus "unable to find tag 'vX.Y.Z'" even when the tag exists.
          # Release downloads are not API-rate-limited.
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run Trivy vulnerability scanner
        run: |
          # CVE gate: CRITICAL/HIGH block; unfixed-in-distro CVEs don't
          # (alpine/npm packages get patched with delay — see .trivyignore)
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore awg-easy:ci

  dockle:
    name: Image hardening audit (dockle)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
      - name: Run dockle
        run: |
          # dockle audits image CONFIG: secrets in layers (FATAL/CRITICAL),
          # :latest tags, root user (WARN), etc.
          # Gate = FATAL: secrets and critical config defects block; the
          # standing WARNs here are by design and cannot be silenced via
          # --accept-key in v0.4.x (verified: it does not suppress CIS-DI-0001):
          # no USER (the app manages WireGuard devices; privileges are
          # restricted at docker run — cap_add/drop in docker-compose.yml) and
          # NoEmptyContinuation (blank comment lines inside multi-line RUN).
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            docker.io/goodwithtech/dockle:v0.4.15 \
            --exit-code 1 --exit-level fatal \
            awg-easy:ci

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build the Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: awg-easy:ci
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
      - name: Install Trivy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate SBOM
        # trivy instead of anchore/sbom-action: syft's version resolver kept
        # failing on GitHub releases API (504 + "unable to find tag").
        # Same tool/version as the CVE job, one less external dependency.
        run: trivy image --format cyclonedx --output sbom.cdx.json awg-easy:ci
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
